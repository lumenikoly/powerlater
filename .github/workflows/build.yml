name: Build and release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        default: '0.0.1'
        type: string

concurrency:
  group: build-and-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            binary: target/release/power-timer
            suffix: ''
          - os: windows-latest
            platform: windows-x64
            binary: target/release/power-timer.exe
            suffix: '.exe'
          - os: macos-latest
            platform: macos-universal
            binary: target/universal-apple-darwin/release/power-timer
            suffix: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Verify release source
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Releases must be run from main; selected ref: $GITHUB_REF" >&2
            exit 1
          }
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libx11-dev libxkbcommon-x11-dev libgl1-mesa-dev
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build release
        if: runner.os != 'macOS'
        run: cargo build --locked --release
      - name: Build macOS universal
        if: runner.os == 'macOS'
        run: |
          cargo build --locked --release --target x86_64-apple-darwin
          cargo build --locked --release --target aarch64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create target/x86_64-apple-darwin/release/power-timer target/aarch64-apple-darwin/release/power-timer -output target/universal-apple-darwin/release/power-timer
      - name: Validate CLI
        shell: bash
        run: |
          "${{ matrix.binary }}" --license | grep -q 'MIT License'
          if "${{ matrix.binary }}" --smoke-test; then exit 1; fi
      - name: Collect artifact
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$RELEASE_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          fi
          test "$VERSION" = "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          grep -Fxq "## $VERSION" CHANGELOG.md
          mkdir release-assets
          cp "${{ matrix.binary }}" "release-assets/PowerTimer-${VERSION}-${{ matrix.platform }}${{ matrix.suffix }}"
      - uses: actions/upload-artifact@v7
        with:
          name: PowerTimer-${{ matrix.platform }}
          path: release-assets/*
          archive: false

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: PowerTimer-*
          path: release-assets
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" release-assets/* --target "$GITHUB_SHA" --title "Power Timer v$VERSION" --notes-file CHANGELOG.md
